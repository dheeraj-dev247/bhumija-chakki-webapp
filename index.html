const thumb=(p,c='h-28')=>IMG[p.id]?`<div class="${c} rounded-xl overflow-hidden relative bg-sc"><img src="${IMG[p.id]}" alt="${p.name}" class="w-full h-full object-cover" loading="lazy"></div>`:`<div class="${c} rounded-xl overflow-hidden relative" style="background:radial-gradient(circle at 50% 35%,#fff9 0%,${p.bg}66 100%),var(--sc)">${art(p)}</div>`;
function card(p){const q=qtyOf(p.id);let btn;
 if(p.cat==='atta')btn=`<button onclick="openSheet('${p.id}')" class="w-full h-10 rounded-xl bg-p text-onp text-xs font-bold">${q?`Customize • ${q} in basket`:'Customize & Add'}</button>`;
 else btn=q?`<div class="h-10 rounded-xl bg-p text-onp flex items-center justify-between px-2"><button onclick="chg('${p.id}|${p.lab}',-1)" class="w-8 h-8 flex items-center justify-center"><span class="ms !text-lg">remove</span></button><b class="text-sm">${q}</b><button onclick="chg('${p.id}|${p.lab}',1)" class="w-8 h-8 flex items-center justify-center"><span class="ms !text-lg">add</span></button></div>`
 :`<button onclick="quick('${p.id}')" class="w-full h-10 rounded-xl bg-pc text-onp text-xs font-bold flex items-center justify-center gap-1"><span class="ms !text-lg">add</span>Add</button>`;
 return `<div class="rounded-2xl bg-w p-3 shadow-sm flex flex-col"><div class="relative">${thumb(p)}<span class="absolute top-1.5 left-1.5 px-2 py-0.5 rounded-full bg-pf text-[10px] font-semibold" style="color:var(--tx)">${p.tag}</span></div>
 <h4 class="text-sm font-semibold mt-2 truncate">${p.name}</h4><div class="text-[11px] text-ol truncate">${p.sub}</div>
 <div class="mt-1.5 mb-2.5"><b class="text-base font-extrabold">₹ ${p.price}</b><span class="text-xs text-ol"> / ${p.per}</span></div><div class="mt-auto">${btn}</div></div>`}
function quick(id){const p=P(id);addItem(id,p.lab,p.price);toast('Added '+p.name);render()}
const match=p=>(S.cat==='all'||p.cat===S.cat)&&(!S.q||(p.name+p.sub).toLowerCase().includes(S.q.toLowerCase()));
function search(v){S.q=v;const g=$('grid');if(g)g.innerHTML=PRODUCTS.filter(match).map(card).join('')||'<p class="col-span-2 text-center text-sm text-ol py-8">No products found</p>'}
function catChips(){return `<div class="flex gap-2 overflow-x-auto noscroll -mx-4 px-4 py-2">${CATS.map(([k,l,ic])=>`<button onclick="S.cat='${k}';render()" class="shrink-0 flex items-center gap-1.5 px-3.5 h-9 rounded-full text-xs font-semibold border ${S.cat===k?'bg-p text-onp border-p':'bg-sl border-ov'}"><span class="ms !text-base">${ic}</span>${l}</button>`).join('')}</div>`}
const searchBar=()=>`<div class="flex items-center h-12 px-3.5 rounded-xl bg-sl shadow-sm mt-1"><span class="ms text-ol">search</span><input value="${S.q}" oninput="search(this.value)" placeholder="Search fresh atta, spices, grains..." class="flex-1 bg-transparent outline-none px-2.5 text-sm"></div>`;
const V={
home(){const feat=['sharbati','multi','khapli','batter','mirch','haldi'].map(P);return `${searchBar()}
<div class="relative overflow-hidden rounded-2xl p-5 mt-3 text-onp" style="background:linear-gradient(135deg,#00361a,#1b4d2e 60%,#082b16);color:#fff"><img src="${HERO}" alt="Freshly milled atta in a clay bowl with wheat" class="absolute inset-0 w-full h-full object-cover" style="object-position:right center"><div class="absolute inset-0" style="background:linear-gradient(90deg,rgba(0,40,18,.94) 0%,rgba(0,54,26,.78) 42%,rgba(0,54,26,0) 80%)"></div><div class="absolute -right-10 -bottom-10 w-44 h-44 rounded-full bg-amber-300/20 blur-2xl"></div>

  <div class="relative flex-1 pointer-events-auto"><div class="flex items-center h-11 px-3.5 rounded-full bg-w shadow-md"><span class="ms text-ol !text-xl">search</span><input id="lq" oninput="locSearch(this.value)" autocomplete="off" placeholder="Search for area, street or landmark" class="flex-1 min-w-0 bg-transparent outline-none px-2 text-sm"></div><div id="lres" class="hidden absolute left-0 right-0 top-12 rounded-2xl bg-w shadow-lg overflow-hidden max-h-72 overflow-y-auto"></div></div></div>
 <div id="pinw" class="absolute left-1/2 top-1/2 pointer-events-none z-[900]" style="transform:translate(-50%,-100%);transition:transform .15s"><div id="ptip" class="absolute bottom-full left-1/2 -translate-x-1/2 mb-1 px-3 py-1.5 rounded-lg bg-tx text-s text-[11px] font-semibold whitespace-nowrap shadow-lg transition-opacity">Move map to adjust pin</div><svg width="44" height="54" viewBox="0 0 44 54" style="filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))"><path d="M22 53C8 38 4 30 4 21a18 18 0 0 1 36 0c0 9-4 17-18 32Z" fill="var(--p)" stroke="#fff" stroke-width="2.5"/><circle cx="22" cy="21" r="7" fill="#fff"/></svg></div>
 <div id="pdot" class="absolute left-1/2 top-1/2 w-3 h-1.5 rounded-full bg-black/35 pointer-events-none z-[900]" style="transform:translate(-50%,-50%);transition:transform .15s"></div>
 <div class="absolute right-3 bottom-6 flex flex-col gap-2 z-[1000]"><button onclick="map&&map.zoomIn()" aria-label="Zoom in" class="w-10 h-10 rounded-full bg-w shadow-md flex items-center justify-center"><span class="ms">add</span></button><button onclick="map&&map.zoomOut()" aria-label="Zoom out" class="w-10 h-10 rounded-full bg-w shadow-md flex items-center justify-center"><span class="ms">remove</span></button><button onclick="tryGeo(false)" aria-label="Use my current location" class="w-12 h-12 rounded-full bg-w shadow-md flex items-center justify-center text-p"><span class="ms fill">my_location</span></button></div></div>
 <div class="bg-s rounded-t-3xl px-4 pt-4 relative z-[1001]" style="box-shadow:0 -8px 24px rgba(0,0,0,.14);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 1rem)">
  <div class="flex items-center gap-3"><img src="${LOGO}" alt="" class="w-11 h-11 rounded-full bg-white p-0.5 shadow-sm shrink-0"><div class="min-w-0 flex-1"><div class="text-[11px] text-ol">${first?'Where should we deliver?':'Delivery location'}</div><div class="flex items-center gap-1"><span class="ms text-p fill !text-xl shrink-0">location_on</span><b id="lname" class="text-base truncate"></b></div><div id="lcoord" class="text-[11px] text-ol line-clamp-2"></div></div></div>
  <input id="ldet" maxlength="120" value="${esc(LS.detail)}" placeholder="House / flat no., building, landmark (optional)" class="w-full h-12 mt-3 px-3.5 rounded-xl bg-sl border border-ov text-sm outline-none focus:border-p">
  <button onclick="saveLoc()" class="w-full h-12 mt-3 rounded-xl bg-p text-onp font-bold text-sm flex items-center justify-center gap-2"><span class="ms !text-xl">check_circle</span>Confirm location</button>
  ${first?'<button onclick="closeLoc()" class="w-full mt-1 py-2 text-xs font-semibold text-tv">Skip for now</button>':''}</div>`;
 $('lname').textContent=LS.area||'Locating…';$('lcoord').textContent=LS.addr||cs();
 if(typeof L==='undefined'){$('lmap').innerHTML='<div class="h-full flex items-center justify-center text-center text-sm text-tv p-8">The map couldn’t load. Please check your internet connection and reopen this screen.</div>';return}
 map=L.map('lmap',{zoomControl:false}).setView([LS.la,LS.ln],S.loc?17:15);
 const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);let te=0;
 osm.on('tileerror',()=>{if(++te===5){map.removeLayer(osm);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'}).addTo(map)}});
 map.on('movestart',()=>lift(true));
 map.on('move',()=>{const c=map.getCenter();LS.la=c.lat;LS.ln=c.lng});
 map.on('moveend',()=>{const c=map.getCenter();LS.la=c.lat;LS.ln=c.lng;lift(false);clearTimeout(gt);gt=setTimeout(revGeo,300)});
 setTimeout(()=>{map&&map.invalidateSize();revGeo()},60)}
function locSearch(v){const r=$('lres');v=v.trim();clearTimeout(stm);if(v.length<3){r.classList.add('hidden');return}
 stm=setTimeout(()=>fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=in&viewbox=${BB.ln0},${BB.la1},${BB.ln1},${BB.la0}&q=${encodeURIComponent(v)}`).then(x=>x.json()).then(j=>{SR=j;r.innerHTML=j.length?j.map((a,i)=>{const p=String(a.display_name).split(',');return `<button onclick="pickRes(${i})" class="w-full flex items-start gap-3 px-3.5 py-3 text-left text-sm border-b border-sh last:border-0"><span class="ms text-ol mt-0.5">location_on</span><span class="min-w-0"><b class="block truncate">${esc(p[0])}</b><span class="block text-[11px] text-ol line-clamp-2">${esc(p.slice(1).join(',').trim())}</span></span></button>`}).join(''):'<div class="px-4 py-3 text-xs text-ol">No results — try another name or drag the map</div>';r.classList.remove('hidden')}).catch(()=>{r.innerHTML='<div class="px-4 py-3 text-xs text-ol">Search isn’t available right now — drag the map instead</div>';r.classList.remove('hidden')}),400)}
function pickRes(i){const a=SR[i];if(!a||!map)return;$('lres').classList.add('hidden');$('lq').value=String(a.display_name).split(',')[0];$('lq').blur();map.setView([+a.lat,+a.lon],17)}
function tryGeo(auto){try{if(!navigator.geolocation){if(!auto)toast('Location isn’t available here — search or drag the map');return}
 navigator.geolocation.getCurrentPosition(p=>{if(map){map.setView([p.coords.latitude,p.coords.longitude],17);toast('Location found — confirm to save')}},()=>{if(!auto)toast('Couldn’t get your location — search or drag the map')},{enableHighAccuracy:true,timeout:10000})}catch(e){if(!auto)toast('Couldn’t get your location — search or drag the map')}}
function openLoc(){LS=S.loc?{la:S.loc.lat,ln:S.loc.lng,detail:S.loc.detail||'',area:S.loc.area||'',addr:S.loc.addr||''}:{la:13.0124,ln:77.7108,detail:'',area:'',addr:''};const o=$('loc');o.classList.remove('hidden');o.classList.add('flex');drawLoc();if(!S.loc)tryGeo(true)}
function closeLoc(){const o=$('loc');o.classList.add('hidden');o.classList.remove('flex')}
function saveLoc(){if(LS.la<BB.la0||LS.la>BB.la1||LS.ln<BB.ln0||LS.ln>BB.ln1)toast('Note: we currently deliver within Bengaluru only');S.loc={area:LS.area||'Pinned location',addr:LS.addr||'',lat:+LS.la.toFixed(5),lng:+LS.ln.toFixed(5),detail:$('ldet').value.trim().slice(0,120)};save();closeLoc();render();toast('Delivering to '+S.loc.area)}
// ---- customize sheet ----
let C={tex:1,pack:1,combos:[]};
function openSheet(id){C={tex:1,pack:1,combos:[],id};drawSheet();$('ov').classList.remove('hidden');requestAnimationFrame(()=>$('sheet').style.transform='translateY(0)')}
function closeSheet(){$('sheet').style.transform='';$('ov').classList.add('hidden');render()}
function cadd(){const [sz,kg]=PACKS[C.pack],pr=P(C.id).price*kg,tx=TEX[C.tex][0];const key=sz+' • '+tx,f=C.combos.find(c=>c.label===key);f?f.qty++:C.combos.push({label:key,unit:pr,qty:1});drawSheet()}
function cq(i,d){C.combos[i].qty+=d;if(C.combos[i].qty<1)C.combos.splice(i,1);drawSheet()}
function drawSheet(){const p=P(C.id),n=C.combos.reduce((a,c)=>a+c.qty,0),t=C.combos.reduce((a,c)=>a+c.qty*c.unit,0);
 const sel=(on)=>on?'bg-p text-onp border-p ring-2 ring-p/20':'bg-s border-ov';
 $('sheet').innerHTML=`<div class="w-10 h-1 rounded-full bg-sh mx-auto mt-2.5"></div>
<div class="px-4 py-3 flex items-center gap-3 border-b border-sh"><div class="w-12 shrink-0">${thumb(p,'h-12')}</div><div class="flex-1 min-w-0"><div class="text-[10px] text-ol">Bhumija Chakki • Stone Milled to order</div><div class="font-bold truncate">${p.name}</div><b class="text-p text-sm">₹${p.price}<span class="text-[11px] font-normal text-tv">/kg</span></b></div><button onclick="closeSheet()" class="w-8 h-8 rounded-full bg-sc flex items-center justify-center"><span class="ms !text-lg">close</span></button></div>
<div class="flex-1 overflow-y-auto px-4 py-3 flex flex-col gap-3"><div class="bg-sl p-3 rounded-2xl border border-ov/50 flex flex-col gap-2.5"><b class="text-xs">Configure Pack Combination</b>
<div><div class="text-[11px] text-tv mb-1">1. Texture</div><div class="grid grid-cols-3 gap-1.5">${TEX.map(([a,b],i)=>`<button onclick="C.tex=${i};drawSheet()" class="py-2 px-1 rounded-lg border text-center ${sel(C.tex===i)}"><div class="text-[11px] font-bold">${a}</div><div class="text-[9px] opacity-75 truncate">${b}</div></button>`).join('')}</div></div>
<div><div class="text-[11px] text-tv mb-1">2. Pack Size</div><div class="grid grid-cols-4 gap-1.5">${PACKS.map(([a,b],i)=>`<button onclick="C.pack=${i};drawSheet()" class="py-1.5 rounded-lg border text-center ${sel(C.pack===i)}"><div class="text-[11px] font-bold">${a}</div><div class="text-[10px] opacity-80">₹${p.price*b}</div></button>`).join('')}</div></div>
<button onclick="cadd()" class="w-full py-2 rounded-lg border border-p/40 text-p text-xs font-bold flex items-center justify-center gap-1.5"><span class="ms !text-lg">add_circle</span>Add ${PACKS[C.pack][0]} • ${TEX[C.tex][0]}</button></div>
<div><div class="flex justify-between text-xs mb-1.5"><b>Your Custom Combinations <span class="text-ol font-medium">(${C.combos.length})</span></b><span class="text-tv">Total ${n} pkts</span></div>
${C.combos.length?C.combos.map((c,i)=>`<div class="flex items-center justify-between p-2 rounded-xl bg-sl mb-1.5"><div><div class="text-xs font-bold">${c.label}</div><div class="text-[10.5px] text-tv">₹${c.unit} each • ₹${c.unit*c.qty}</div></div><div class="flex items-center gap-1"><div class="flex items-center rounded-lg bg-s border border-ov"><button onclick="cq(${i},-1)" class="w-7 h-7 flex items-center justify-center"><span class="ms !text-base">remove</span></button><b class="w-5 text-center text-xs">${c.qty}</b><button onclick="cq(${i},1)" class="w-7 h-7 flex items-center justify-center"><span class="ms !text-base">add</span></button></div><button onclick="C.combos.splice(${i},1);drawSheet()" class="w-7 h-7 text-ol"><span class="ms !text-lg">delete</span></button></div></div>`).join(''):'<div class="text-xs text-ol text-center py-4 border border-dashed border-ov rounded-xl">Pick a texture and size, then tap “Add”.</div>'}</div></div>
<div class="px-4 pt-2 pb-3 border-t border-sh"><button ${n?'':'disabled'} onclick="addCombos()" class="w-full h-12 rounded-xl bg-p text-onp font-bold text-sm flex items-center justify-between px-4 ${n?'':'opacity-40'}"><span class="flex items-center gap-2"><span class="ms !text-lg">shopping_bag</span>Add ${n} Packet${n===1?'':'s'} to Basket</span><span>₹${t}</span></button></div>`}
function addCombos(){C.combos.forEach(c=>addItem(C.id,c.label,c.unit,c.qty));toast('Added '+C.combos.reduce((a,c)=>a+c.qty,0)+' packets to basket');closeSheet()}
addEventListener('hashchange',()=>{$('sheet').style.transform='';$('ov').classList.add('hidden');render();scrollTo(0,0)});
render();if(!S.loc)openLoc(true);
</script></body></html>
